name: quality

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci:checks
      - run: npm run release:build
        env:
          RETROM_PROVIDER_BUILD_MODE: candidate
          RETROM_PFB_CANDIDATE_BUILD: "1"
          # Exercise tag-derived identity without publishing release metadata.
          GITHUB_REF_TYPE: tag
          GITHUB_REF_NAME: v0.0.0-rc.1
      - run: npm run package:check

  content_io_browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:content-io:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-io-browser
          path: .artifacts/content-io/ci/
          include-hidden-files: true

  quality:
    runs-on: ubuntu-latest
    needs: [checks, content_io_browser]
    if: ${{ always() }}
    steps:
      - name: Require all runtime checks
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.content_io_browser.result }}
        run: test "$CHECKS_RESULT" = success && test "$BROWSER_RESULT" = success
