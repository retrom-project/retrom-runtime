name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate release identity
        run: |
          set -euo pipefail
          package_version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v${package_version}"
          git fetch --force origin \
            "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          test "$(git rev-list -n 1 "refs/tags/$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin '+refs/heads/master:refs/remotes/origin/master'
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run release:build
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/retrom-runtime-*.tar.gz release/xxxsen-retrom-runtime-*.tgz release/retrom-runtime-release.json release/providers/*/*-provider-*.tar.gz release/providers/provider-release.json --generate-notes --verify-tag
