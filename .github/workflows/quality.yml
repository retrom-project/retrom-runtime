name: quality

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Prepare hash-pinned unpublished core input
        env:
          RETROM_CORE_CANDIDATE_BASE_URL: ${{ vars.RETROM_CORE_CANDIDATE_BASE_URL }}
        run: node scripts/prepare-core-candidates.mjs --base-url "$RETROM_CORE_CANDIDATE_BASE_URL" --output "$RUNNER_TEMP/runtime-core-inputs" >> "$GITHUB_ENV"
      - run: npm run release:build
        env:
          RETROM_PROVIDER_BUILD_MODE: candidate
          RETROM_PFB_CANDIDATE_BUILD: "1"
          # Exercise tag-derived identity without publishing release metadata.
          GITHUB_REF_TYPE: tag
          GITHUB_REF_NAME: v0.0.0-rc.1
      - run: npm run package:check
